name: Docker Build and Publish

on:
  schedule:
    - cron: '37 7 * * *'
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  ## github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ## define job to build and publish docker image
  build-and-push-docker-image:
    name: Build Docker image and push to DockerHub and Github Container Registry
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.version.outputs.caddy_version }}
    permissions:
      contents: read
      packages: write
      ## This is used to complete the identity challenge
      ## with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      ## https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      ## Caddy version is defined once, in the Dockerfile (updated by Renovate)
      - name: Read Caddy version from Dockerfile
        id: version
        run: |
          version=$(sed -n 's/^ARG BUILD_CADDY_VERSION=\(.*\)$/\1/p' Dockerfile)
          if [ -z "$version" ]; then echo "Could not find BUILD_CADDY_VERSION in Dockerfile" >&2; exit 1; fi
          echo "caddy_version=$version" >> "$GITHUB_OUTPUT"

      ## https://github.com/docker/build-push-action
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      ## https://github.com/docker/login-action
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ## https://github.com/docker/login-action
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ## https://github.com/docker/metadata-action
      # - name: Extract Docker metadata
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: docker.io/caddy
      #     tags: |
      #       type=semver,pattern={{version}}
      #       type=semver,pattern={{major}}.{{minor}}
      #       type=semver,pattern={{major}}
      #     flavor: |
      #       latest=true
  
      ## https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: .
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8
          push: ${{ github.event_name != 'pull_request' }}
          # tags: ${{ steps.meta.outputs.tags }}
          # labels: ${{ steps.meta.outputs.labels }}
          tags: |
            docker.io/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.caddy_version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.caddy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build-and-push.outputs.digest }}

  ## Create a git tag + release matching the Caddy version (e.g. v2.11.2), once per version
  tag-release:
    name: Tag and release matching the Caddy version
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      TAG: v${{ needs.build-and-push-docker-image.outputs.caddy_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check whether release exists
        id: check
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      ## Creates the tag on the triggering commit if it does not exist yet
      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Caddy ${TAG} with plugins. Docker image: \`ghcr.io/${GITHUB_REPOSITORY}:${TAG#v}\`"

  ## Separate job to extract binaries from generated images
  extract-caddy-binaries:

    name: Extract caddy binaries from docker images, and create Github artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    permissions:
      contents: write

    # Make sure the docker images have been built first
    needs: [build-and-push-docker-image, tag-release]
    # Images are only pushed outside of pull requests
    if: github.event_name != 'pull_request'

    steps:

      # Extract files from created docker images
      - name: extract binary file from docker image
        shell: bash
        run: |
          dest_dir=./caddy/${{ matrix.os }}/
          mkdir -p $dest_dir
          docker cp $(docker create docker.io/${{ github.repository }}:${{ needs.build-and-push-docker-image.outputs.caddy_version }}):/usr/bin/caddy ${dest_dir}
          dest=./caddy-$(uname -m)
          mv ${dest_dir}/caddy $dest
          $dest --version
          $dest list-modules
          md5sum $dest
          sha256sum $dest

      - name: upload linux artifact
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          files: ./caddy-*

      ## Raw binaries are also attached to the release matching the Caddy version.
      ## Uses `gh release upload` (assets only) rather than editing the release.
      - name: upload linux artifact to versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.build-and-push-docker-image.outputs.caddy_version }}" ./caddy-* \
            --repo "$GITHUB_REPOSITORY" --clobber
